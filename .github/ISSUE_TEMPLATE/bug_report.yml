name: Bug report
description: Report a reproducible problem with img-gen
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve img-gen. Do not include secrets, private prompts, or security vulnerabilities in this form.
  - type: checkboxes
    id: checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Run ...
        2. Select ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: Model
      options:
        - Stable Diffusion v1.5
        - Stable Diffusion XL
        - Kandinsky 2.2
        - Not model-specific
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, CPU/GPU, and relevant package versions.
      placeholder: Windows 11, Python 3.11, NVIDIA RTX ..., torch ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, private prompts, paths, and other sensitive information.
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add anything else that may help reproduce or diagnose the problem.
